name: Bug report
description: Something is broken or behaves unexpectedly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make docker-up`
        2. Open the flow editor
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - platform (UI)
        - platform-api
        - mcp-api
        - webhook-api
        - file-gateway-api
        - workers (task / event-relay)
        - go-packages
        - docker / setup
        - other
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running BlockNext?
      options:
        - make docker-up (published images)
        - make docker-dev-up (built from source)
        - other (describe below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag (e.g. v0.0.1) or commit hash.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `make docker-logs` / `make docker-dev-logs` for the failing service. Redact secrets.
      render: shell
