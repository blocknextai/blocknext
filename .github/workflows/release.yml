name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: platform-api
            dockerfile: docker/platform-api/api.Dockerfile
            build-args: |
              BINARY_NAME=platform-api
              PORT=3000
          - image: mcp-api
            dockerfile: docker/platform-api/api.Dockerfile
            build-args: |
              BINARY_NAME=mcp-api
              PORT=3100
          - image: webhook-api
            dockerfile: docker/platform-api/api.Dockerfile
            build-args: |
              BINARY_NAME=webhook-api
              PORT=3200
          - image: task-worker
            dockerfile: docker/platform-api/worker.Dockerfile
            build-args: |
              BINARY_NAME=task-worker
          - image: event-relay-worker
            dockerfile: docker/platform-api/worker.Dockerfile
            build-args: |
              BINARY_NAME=event-relay-worker
          - image: platform-api-migration
            dockerfile: docker/platform-api/migration.Dockerfile
            build-args: ""
          - image: file-gateway-api
            dockerfile: docker/file-gateway-api/Dockerfile
            build-args: ""
          - image: platform
            dockerfile: docker/platform/nginx.Dockerfile
            build-args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
