name: blocknext

services:
  db:
    image: postgres:18-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${CACHE_REDIS_PASSWORD:?CACHE_REDIS_PASSWORD is required}", "--appendonly", "no", "--save", ""]
    restart: unless-stopped

  task-queue-redis:
    image: redis:8-alpine
    container_name: task-queue-redis
    command: ["redis-server", "--requirepass", "${TASK_RUNNER_QUEUE_REDIS_PASSWORD:?TASK_RUNNER_QUEUE_REDIS_PASSWORD is required}", "--appendonly", "yes", "--save", "60 1"]
    restart: unless-stopped
    profiles:
      - queue
    volumes:
      - task_queue_redis_data:/data

  platform-api-migration:
    container_name: platform-api-migration
    image: ghcr.io/blocknextai/platform-api-migration:${BLOCKNEXT_VERSION:-latest}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  platform-api:
    restart: on-failure:10
    env_file:
      - .env
    depends_on:
      platform-api-migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    container_name: platform-api
    image: ghcr.io/blocknextai/platform-api:${BLOCKNEXT_VERSION:-latest}
    ports:
      - "${PLATFORM_API_PORT:-3000}:${PLATFORM_API_PORT:-3000}"

  mcp-api:
    restart: on-failure:10
    env_file:
      - .env
    depends_on:
      platform-api-migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    container_name: mcp-api
    image: ghcr.io/blocknextai/mcp-api:${BLOCKNEXT_VERSION:-latest}
    ports:
      - "${MCP_API_PORT:-3100}:${MCP_API_PORT:-3100}"

  webhook-api:
    restart: on-failure:10
    env_file:
      - .env
    depends_on:
      platform-api-migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    container_name: webhook-api
    image: ghcr.io/blocknextai/webhook-api:${BLOCKNEXT_VERSION:-latest}
    ports:
      - "${WEBHOOK_API_PORT:-3200}:${WEBHOOK_API_PORT:-3200}"

  task-worker:
    restart: on-failure:10
    profiles:
      - queue
    env_file:
      - .env
    depends_on:
      platform-api-migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    container_name: task-worker
    image: ghcr.io/blocknextai/task-worker:${BLOCKNEXT_VERSION:-latest}

  event-relay-worker:
    restart: on-failure:10
    env_file:
      - .env
    depends_on:
      platform-api-migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    container_name: event-relay-worker
    image: ghcr.io/blocknextai/event-relay-worker:${BLOCKNEXT_VERSION:-latest}

  file-gateway-api:
    container_name: file-gateway-api
    image: ghcr.io/blocknextai/file-gateway-api:${BLOCKNEXT_VERSION:-latest}
    restart: on-failure:10
    env_file:
      - .env
    ports:
      - "${FILE_GATEWAY_API_PORT:-3300}:${FILE_GATEWAY_API_PORT:-3300}"
    depends_on:
      - redis

  platform:
    container_name: platform
    image: ghcr.io/blocknextai/platform:${BLOCKNEXT_VERSION:-latest}
    restart: on-failure:10
    env_file:
      - .env
    ports:
      - "${PLATFORM_UI_PORT:-4000}:4000"

volumes:
  postgres_data:
  task_queue_redis_data:
